[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wintermute"
version = "0.1.0"
description = "Research codebase for training small language models on constrained hardware."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate",
    "datasets",
    "duckdb>=2",
    "lm_eval>=0.4.12,<0.5",
    "pyarrow",
    "PyYAML",
    "slack-bolt",
    "slack-sdk",
    "zstandard",
    "tensorboard",
    "tokenizers",
    "torch",
    "transformers",
    "xxhash>=3.6,<4",
]

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest",
]

[project.scripts]
wintermute = "wintermute.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
