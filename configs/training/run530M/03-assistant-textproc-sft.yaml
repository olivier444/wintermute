version: 2

run_id: qlike3-run.003-assistant-textproc-sft

notes: Anchor / Text Processing / Reasonning

configuration:
  reference_run_id: qlike3-run.002-continued-pretrain2
  reference_checkpoint: last_hot_2

  training_view_preset: assistant-textproc

  task_config:
    wrapper_class: CausalLmTaskWrapper
    params:
      windowing_policy:
        add_eos_at_end_of_doc: true
        align_last_window_to_end: true
        min_new_tokens: 256
        overlap: 128
        window_max_len: 1_024
      packing_policy:
        enabled: true
        max_docs_per_pack: 3
        target_fill_ratio: 0.8
        example_buffer_size: 200
      tokenizer_id: enfr-bpe-sd-nfc-48
      assistant_format: normalized
      use_task_labels: true
      tag_loss_weight: 4.0
      format_labels:
      - label: boolean
        pattern: (?i)\s*(?:yes|no|oui|non|true|false|vrai|faux)\s*
      - label: number
        pattern: (?i)\s*[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)(?:e[+-]?\d+)?\s*
      - label: python
        matcher: python
      - label: word
        matcher: word
      completion_position_weighting:
        boundaries:
        - 1
        - 3
        - 7
        weights:
        - 8.0
        - 4.0
        - 2.0
        - 1

  model_config:
    name: simple-v6
    builder_class: DecoderV2
    params:
      d_ff: 5_504
      d_model: 1_024
      embedding_dim: 1_024
      dropout: 0.0
      max_seq_len: 1_024
      n_heads: 16
      n_kv_heads: 8
      n_layers: 24
      vocab_size: 48_000
      tie_embeddings: true
      mlp_activation: swiglu
      norm: rms
      qk_norm: true

  baseline_config:
    external_models:
      smollm2_135m_instruct: HuggingFaceTB/SmolLM2-135M-Instruct
      smollm2_360m_instruct: HuggingFaceTB/SmolLM2-360M-Instruct

  lr_config:
    start_lr: 5.0e-05
    max_lr: 0.0001
    end_lr: 5.0e-05
    warmup_length_ratio: 0.006
    cos_decay_start_ratio: 0.9

  trainer_config:
    kind: supervised
    load_reference_optimizer_state: true
    checkpoint_every_batch: 50
    max_training_units: 800_000_000
    batch_size: 12
    grad_accum_size_units: 200_000
    seed: 827
    use_bf16: true
    model_save_pcts:
    - 5
    - 10
    - 20
    - 40
    - 70
    gradient_noise_update_batch_count: 0

  evaluation_configs:
  - name: grounded-qa
    is_primary: true
    view_preset: ufw-l3-qa-eval
    max_eval_units: 100_000   # max_eval_units applies to loss tokens only
  - name: def4
    max_eval_units: 800_000  
    view_preset: default4-eval-pretrain
  - name: code
    max_eval_units: 800_000
    view_preset: code-eval-pretrain
  - name: french
    max_eval_units: 800_000
    view_preset: french-eval-pretrain
  - name: translation
    max_eval_units: 800_000
    view_preset: news-commentary-eval
  - name: summarization
    max_eval_units: 800_000
    view_preset: xsum-eval
  - name: problem-solving
    max_eval_units: 800_000
    view_preset: problem-solving-eval
  - name: information-extraction
    max_eval_units: 800_000
    view_preset: boolq-eval

  probe_configs:
  - preset: sft
    probe_modulus: 1
    tensorboard_metrics:
    - mean_score
    - greedy_pass@1
    - pass@4
    - lpass@4
    slack_observable: true

  benchmark_config:
    every_n_checkpoints: 2
    tasks:
    - hellaswag
    - arc_easy
    - arc_challenge
    - openbookqa
    - piqa
    - winogrande
    - copa
    - lambada_openai
    - truthfulqa_mc2
    - boolq
    - mmlu
    batch_size: 8
    seed: 827

  optimizer_config:
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-08
    grad_clip: 1
    weight_decay: 0.01

  slack_config:
    channel: wintermute
    push_interval_sec: 60
    secret_file: ~/.secrets/secret1.gpg
    bot_token_secret_id: textdata.train.slack.bot
    app_token_secret_id: textdata.train.slack.app
